<?xml version="1.0" encoding="UTF-8"?>
<svg id="Calque_2" data-name="Calque 2" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 300 300">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="300" height="300" rx="40" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- 4 Categories Composite Grid -->
  <!-- Top Left: Restaurant -->
  <image href="/images/restaurant.svg" x="15" y="15" width="130" height="130" preserveAspectRatio="xMidYMid meet"/>
  
  <!-- Top Right: Fast Food -->
  <image href="/images/fast food.svg" x="155" y="15" width="130" height="130" preserveAspectRatio="xMidYMid meet"/>
  
  <!-- Bottom Left: Glassier -->
  <image href="/images/glassier.svg" x="15" y="155" width="130" height="130" preserveAspectRatio="xMidYMid meet"/>
  
  <!-- Bottom Right: Jus -->
  <image href="/images/jus.svg" x="155" y="155" width="130" height="130" preserveAspectRatio="xMidYMid meet"/>
</svg>
